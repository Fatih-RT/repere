services:
  pocketbase:
    build:
      context: ..
      dockerfile: Dockerfile
      target: pocketbase
      args:
        PB_VERSION: ${PB_VERSION:-0.39.11}
    restart: unless-stopped
    volumes:
      - ../pb_data:/pb/pb_data
      - ../pb_public:/pb/pb_public
      - ../pb_migrations:/pb/pb_migrations:ro
      - ../pb_hooks:/pb/pb_hooks:ro
    # No `ports:` on purpose — nothing is published on the host. The only
    # way in is through the Cloudflare Tunnel below, over the private
    # compose network (cloudflared reaches this container as `pocketbase`).

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    # Via TUNNEL_TOKEN rather than `--token` on the command line: an
    # argv-passed secret shows up in plain text in `docker ps`/`ps aux`
    # (visible to anyone else on the host with shell access), an env var
    # doesn't. cloudflared reads TUNNEL_TOKEN itself when no --token flag
    # is given — this is standard, documented behavior, not a workaround.
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env — see README}
    depends_on:
      - pocketbase
